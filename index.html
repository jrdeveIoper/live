<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Link</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0f172a;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:520px;
  background:#1e293b;
  border-radius:18px;
  padding:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* USER */

#userPage{
  text-align:center;
}

#userPage h1{
  font-size:24px;
  margin-bottom:20px;
}

.liveLink{
  display:block;
  width:100%;
  padding:15px;
  border-radius:10px;
  background:#0f172a;
  color:#60a5fa;
  text-decoration:none;
  word-break:break-all;
  margin-bottom:12px;
  text-align:left;
}

.liveLink:hover{
  text-decoration:underline;
}

.copyBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.copyBtn:hover{
  background:#15803d;
}

/* ADMIN */

#adminPage{
  display:none;
}

#adminPage h1{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1;
}

input{
  width:100%;
  padding:14px;
  border:0;
  outline:0;
  border-radius:10px;
  font-size:15px;
  margin-bottom:12px;
}

.adminBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.adminBtn:hover{
  background:#1d4ed8;
}

.message{
  text-align:center;
  margin-top:12px;
  min-height:20px;
}

.success{
  color:#86efac;
}

.error{
  color:#fca5a5;
}

.current{
  margin-top:25px;
  padding:15px;
  border-radius:10px;
  background:#0f172a;
  display:none;
}

.currentTitle{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:8px;
}

.currentLink{
  color:#60a5fa;
  word-break:break-all;
}

/* Small admin access */

.adminAccess{
  margin-top:20px;
  text-align:center;
}

.adminAccess a{
  color:#64748b;
  font-size:12px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- ================= USER PAGE ================= -->

  <div id="userPage">

    <h1>🔗 Live Link</h1>

    <div id="userContent">

      <a
        id="userLink"
        class="liveLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer">
      </a>

      <button
        class="copyBtn"
        onclick="copyLink()">
        📋 Copy Link
      </button>

      <div
        id="copyMessage"
        class="message">
      </div>

    </div>

    <div
      id="noLink"
      style="color:#94a3b8;display:none;">
      No live link available.
    </div>

    <!-- Hidden admin access -->
    <div class="adminAccess">
      <a href="?admin">Admin</a>
    </div>

  </div>


  <!-- ================= ADMIN PAGE ================= -->

  <div id="adminPage">

    <h1>🔐 Admin Panel</h1>

    <label for="adminPassword">
      Admin Password
    </label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Enter password">

    <button
      class="adminBtn"
      onclick="login()">
      Login
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>


    <!-- Controls appear after login -->

    <div id="controls" style="display:none;">

      <label style="margin-top:20px;">
        Live Website URL
      </label>

      <input
        id="liveUrl"
        type="url"
        placeholder="https://example.com">

      <button
        class="adminBtn"
        onclick="saveLink()">
        💾 Save Live Link
      </button>

      <div
        id="saveMessage"
        class="message">
      </div>


      <div
        id="currentBox"
        class="current">

        <div class="currentTitle">
          Current Live Link
        </div>

        <div
          id="currentLink"
          class="currentLink">
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/*
====================================================
                    SETTINGS
====================================================
*/

const ADMIN_PASSWORD = "admin123";

const STORAGE_KEY = "my_live_link";


/*
====================================================
                    PAGE MODE
====================================================
*/

const isAdmin =
  new URLSearchParams(location.search).has("admin");

if(isAdmin){

  document.getElementById("userPage")
    .style.display = "none";

  document.getElementById("adminPage")
    .style.display = "block";

}else{

  document.getElementById("userPage")
    .style.display = "block";

  document.getElementById("adminPage")
    .style.display = "none";

  showUserLink();

}


/*
====================================================
                    ADMIN LOGIN
====================================================
*/

function login(){

  const password =
    document.getElementById("adminPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(password === ADMIN_PASSWORD){

    document.getElementById("controls")
      .style.display = "block";

    message.textContent =
      "✅ Login successful";

    message.className =
      "message success";


    // Load existing link

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      document.getElementById("liveUrl").value =
        saved;

      document.getElementById("currentBox")
        .style.display = "block";

      document.getElementById("currentLink")
        .textContent = saved;

    }

  }else{

    message.textContent =
      "❌ Wrong password";

    message.className =
      "message error";

  }

}


/*
====================================================
                    SAVE LINK
====================================================
*/

function saveLink(){

  const input =
    document.getElementById("liveUrl");

  const value =
    input.value.trim();

  const message =
    document.getElementById("saveMessage");


  if(!value){

    message.textContent =
      "❌ Please enter a URL";

    message.className =
      "message error";

    return;

  }


  // Validate URL

  try{

    const url =
      new URL(value);

    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      throw new Error();

    }

  }catch{

    message.textContent =
      "❌ Enter a valid http/https URL";

    message.className =
      "message error";

    return;

  }


  /*
    Save in browser localStorage.
    No database required.
  */

  localStorage.setItem(
    STORAGE_KEY,
    value
  );


  document.getElementById("currentBox")
    .style.display = "block";

  document.getElementById("currentLink")
    .textContent = value;


  message.textContent =
    "✅ Live link saved!";

  message.className =
    "message success";

}


/*
====================================================
                    USER PAGE
====================================================
*/

function showUserLink(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  const userContent =
    document.getElementById("userContent");

  const noLink =
    document.getElementById("noLink");

  const userLink =
    document.getElementById("userLink");


  if(!saved){

    userContent.style.display =
      "none";

    noLink.style.display =
      "block";

    return;

  }


  userContent.style.display =
    "block";

  noLink.style.display =
    "none";


  userLink.href =
    saved;

  userLink.textContent =
    saved;

}


/*
====================================================
                    COPY LINK
====================================================
*/

async function copyLink(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if(!saved){
    return;
  }


  try{

    await navigator.clipboard.writeText(saved);

  }catch{

    const textarea =
      document.createElement("textarea");

    textarea.value =
      saved;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

  }


  const message =
    document.getElementById("copyMessage");

  message.textContent =
    "✅ Link copied!";

  message.className =
    "message success";


  setTimeout(()=>{

    message.textContent = "";

  },2000);

}

</script>

</body>
</html>
