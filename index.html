<!DOCTYPE html>
<html>
<head>
    <title>Live Chat - 2 User</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, sans-serif; 
            max-width: 750px; 
            margin: 20px auto; 
            padding: 15px; 
            background: #121212; 
            color: #e0e0e0;
        }
        .container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .header h1 { color: #fff; font-size: 20px; }
        .header-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            touch-action: manipulation;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-secondary { background: #444; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .user-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .user-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            background: #333;
            color: #888;
            transition: all 0.3s;
        }
        .user-btn.active { background: #007bff; color: white; }
        .user-btn.admin-user { border: 1px solid #dc3545; }
        .chat-box {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #444;
            margin: 10px 0;
        }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track { background: #1e1e1e; border-radius: 10px; }
        .chat-box::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .msg {
            margin: 6px 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            word-break: break-word;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.aish { background: #007bff; color: white; margin-right: auto; border-bottom-left-radius: 4px; }
        .msg.user1 { background: #28a745; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg.system { background: #444; color: #aaa; margin: 10px auto; text-align: center; font-size: 12px; max-width: 90%; }
        .msg .sender {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .msg .time {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .msg .delete-btn {
            background: rgba(255,0,0,0.4);
            border: none;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            margin-left: 8px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
            min-width: 150px;
        }
        .input-area input::placeholder { color: #888; }
        .input-area button { padding: 12px 24px; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
            flex-wrap: wrap;
            gap: 5px;
        }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .status-dot.online { background: #28a745; }
        .status-dot.offline { background: #dc3545; }
        .empty-msg { color: #666; text-align: center; padding: 40px 0; }
        .msg-count { font-size: 12px; color: #666; }
        .password-box, .request-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 10px;
            display: none;
        }
        .password-box input, .request-box input {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .password-box button, .request-box button { padding: 10px 20px; }
        .request-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid #ffc107;
        }
        .request-item .name { font-weight: bold; color: #fff; }
        .request-item .id { font-size: 10px; color: #666; margin-left: 8px; }
        .request-item .time { font-size: 11px; color: #888; }
        .notification-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: #dc3545; margin-left: 5px; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .contact-section {
            margin-top: 15px; padding-top: 12px; border-top: 1px solid #333;
            text-align: center; font-size: 13px;
        }
        .contact-section a { color: #4da6ff; text-decoration: none; margin: 0 8px; }
        @media (max-width: 500px) {
            .header { flex-direction: column; align-items: stretch; }
            .user-selector { justify-content: center; }
            .input-area button { width: 100%; }
            .chat-box { height: 300px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💬 Live Chat</h1>
        <div class="header-controls">
            <button class="btn btn-warning btn-sm" id="requestBtn" onclick="toggleRequest()">📩 Request <span id="requestBadge" style="display:none;" class="notification-dot"></span></button>
            <button class="btn btn-secondary btn-sm" onclick="toggleAdmin()">🔐 Admin</button>
        </div>
    </div>

    <!-- Admin Password -->
    <div class="password-box" id="passwordBox">
        <strong style="color:#fff;">🔐 Admin Password</strong>
        <input type="password" id="adminPassword" placeholder="Enter admin password" />
        <button class="btn btn-primary" onclick="verifyAdmin()">✅ Verify</button>
        <p style="color:#888; font-size:12px; margin-top:5px;">Default: <strong>admin123</strong></p>
    </div>

    <!-- Request Box -->
    <div class="request-box" id="requestBox">
        <strong style="color:#fff;">📩 Join Request</strong>
        <p style="color:#888; font-size:12px;">Enter a username to request joining the chat.</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="requestName" placeholder="Choose a username" style="flex:1; min-width:120px;" />
            <button class="btn btn-primary" onclick="sendRequest()">📤 Send Request</button>
        </div>
        <div id="requestStatus" style="margin-top:8px; font-size:13px; color:#888;"></div>
        <div id="requestIdDisplay" style="margin-top:4px; font-size:11px; color:#555;"></div>
    </div>

    <!-- User Selector -->
    <div class="user-selector" id="userSelector">
        <button class="user-btn admin-user active" data-user="aish" onclick="setUser('aish')">👑 @aish</button>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span><span class="status-dot online" id="statusDot"></span> <span id="statusText">Connected</span></span>
        <span class="msg-count" id="msgCount">0 messages</span>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <p class="empty-msg">💬 No messages yet. Start chatting!</p>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Type your message..." />
        <button class="btn btn-success" onclick="sendMessage()">📤 Send</button>
    </div>

    <div class="contact-section">
        <a href="https://facebook.com/yadavaiswary" target="_blank">📘 @yadavaiswary</a>
        <a href="https://instagram.com/yadavaiswary" target="_blank">📷 @yadavaiswary</a>
        <a href="https://twitter.com/yadavaiswary" target="_blank">🐦 @yadavaiswary</a>
        <br>
        <a href="mailto:queries.aish@gmail.com" style="color:#888; font-size:12px;">📧 queries.aish@gmail.com</a>
    </div>
</div>

<script>
    // ============================================================
    // 🔥 CONFIG
    // ============================================================
    const BIN_ID = '6a9e8273ac6210605aaef916';
    const ADMIN_PASSWORD = 'admin123';
    const MAX_USERS = 1; // Only 1 other user allowed

    // ============================================================
    // 🚀 CHAT SYSTEM
    // ============================================================

    let messages = [];
    let currentUser = 'aish';
    let isAdmin = false;
    let isSaving = false;
    let users = ['aish'];
    let pendingRequests = [];
    let myUniqueId = '';
    let chatEnabled = false; // User can chat only if approved

    // ========== 🆔 UNIQUE ID ==========
    async function getUniqueId() {
        let storedId = localStorage.getItem('chat_user_id');
        if (storedId) return storedId;
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            const ip = ipData.ip || 'unknown';
            const fingerprint = navigator.userAgent + navigator.language + screen.width + screen.height;
            const hash = await sha256(ip + fingerprint);
            const uniqueId = hash.substring(0, 16);
            localStorage.setItem('chat_user_id', uniqueId);
            return uniqueId;
        } catch {
            const fallbackId = 'user_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
            localStorage.setItem('chat_user_id', fallbackId);
            return fallbackId;
        }
    }

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ========== 👤 SET USER ==========
    function setUser(user) {
        if (!users.includes(user)) {
            showStatus('❌ User not found!', 'error');
            return;
        }
        currentUser = user;
        document.querySelectorAll('.user-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.user === user);
        });
        document.getElementById('chatInput').placeholder = user === 'aish' ? 'Message as @aish...' : `Message as @${user}...`;
    }

    // ========== 🔐 ADMIN ==========
    function verifyAdmin() {
        const input = document.getElementById('adminPassword');
        if (input.value.trim() === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById('passwordBox').style.display = 'none';
            showStatus('✅ Admin mode ON', 'success');
            renderRequests();
            displayMessages();
        } else {
            showStatus('❌ Wrong password!', 'error');
            input.value = '';
        }
    }

    function toggleAdmin() {
        const box = document.getElementById('passwordBox');
        if (isAdmin) {
            isAdmin = false;
            box.style.display = 'none';
            showStatus('🔐 Admin mode OFF', 'info');
            displayMessages();
        } else {
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if (box.style.display === 'block') document.getElementById('adminPassword').focus();
        }
    }

    // ========== 📩 REQUEST ==========
    async function toggleRequest() {
        const box = document.getElementById('requestBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
        if (box.style.display === 'block') {
            if (!myUniqueId) myUniqueId = await getUniqueId();
            document.getElementById('requestIdDisplay').textContent = '🆔 Your ID: ' + myUniqueId;
            document.getElementById('requestName').focus();
        }
    }

    async function sendRequest() {
        const input = document.getElementById('requestName');
        const name = input.value.trim().toLowerCase();
        if (!name) return document.getElementById('requestStatus').textContent = '❌ Please enter a username!';
        if (name === 'aish') return document.getElementById('requestStatus').textContent = '❌ "aish" is reserved!';
        if (users.includes(name)) return document.getElementById('requestStatus').textContent = '❌ User already exists!';
        if (!myUniqueId) myUniqueId = await getUniqueId();
        if (pendingRequests.some(r => r.uniqueId === myUniqueId)) {
            return document.getElementById('requestStatus').textContent = '⏳ You already have a pending request!';
        }
        if (localStorage.getItem('chat_request_sent') === 'true') {
            return document.getElementById('requestStatus').textContent = '⏳ You already sent a request! Wait for admin.';
        }
        if (users.length >= MAX_USERS + 1) {
            return document.getElementById('requestStatus').textContent = '❌ Chat is full! Only 1 other user allowed.';
        }

        const newRequest = {
            id: 'req_' + Date.now(),
            name: name,
            uniqueId: myUniqueId,
            timestamp: new Date().toISOString(),
            status: 'pending'
        };
        pendingRequests.push(newRequest);
        localStorage.setItem('chat_request_sent', 'true');
        await saveRequests();
        input.value = '';
        document.getElementById('requestStatus').textContent = '✅ Request sent! Waiting for admin approval.';
        document.getElementById('requestStatus').style.color = '#28a745';
        document.getElementById('requestBadge').style.display = 'inline-block';
        if (isAdmin) renderRequests();
    }

    async function approveRequest(id) {
        if (!isAdmin) return showStatus('❌ Admin login required!', 'error');
        const request = pendingRequests.find(r => r.id === id);
        if (!request) return;
        if (users.length >= MAX_USERS + 1) {
            showStatus(`❌ Max ${MAX_USERS} other user allowed!`, 'error');
            return;
        }
        users.push(request.name);
        pendingRequests = pendingRequests.filter(r => r.id !== id);
        chatEnabled = true; // Enable chat for user
        await saveRequests();
        await saveUsers();
        renderUsers();
        renderRequests();
        showStatus(`✅ @${request.name} added! Now they can chat.`, 'success');
        document.getElementById('requestBadge').style.display = pendingRequests.length > 0 ? 'inline-block' : 'none';
        // If the current user is the one who got approved, enable chat
        if (myUniqueId === request.uniqueId) {
            chatEnabled = true;
            document.getElementById('chatInput').disabled = false;
            document.getElementById('chatInput').placeholder = `Message as @${request.name}...`;
        }
    }

    async function rejectRequest(id) {
        if (!isAdmin) return showStatus('❌ Admin login required!', 'error');
        pendingRequests = pendingRequests.filter(r => r.id !== id);
        await saveRequests();
        renderRequests();
        document.getElementById('requestBadge').style.display = pendingRequests.length > 0 ? 'inline-block' : 'none';
        showStatus('🗑️ Request rejected', 'info');
    }

    function renderRequests() {
        const container = document.getElementById('pendingRequests') || document.createElement('div');
        if (!isAdmin) {
            container.innerHTML = '<p style="color:#888; font-size:13px;">🔐 Admin login to manage requests.</p>';
            return;
        }
        if (pendingRequests.length === 0) {
            container.innerHTML = '<p style="color:#888; font-size:13px;">✅ No pending requests.</p>';
            return;
        }
        container.innerHTML = pendingRequests.map(r => `
            <div class="request-item">
                <div>
                    <span class="name">@${r.name}</span>
                    <span class="id">🆔 ${r.uniqueId}</span>
                    <span class="time">${new Date(r.timestamp).toLocaleString()}</span>
                </div>
                <div class="actions">
                    <button class="btn btn-success btn-sm" onclick="approveRequest('${r.id}')">✅ Approve</button>
                    <button class="btn btn-danger btn-sm" onclick="rejectRequest('${r.id}')">❌ Reject</button>
                </div>
            </div>
        `).join('');
    }

    // ========== 👥 USERS ==========
    function renderUsers() {
        const selector = document.getElementById('userSelector');
        selector.innerHTML = users.map(u => {
            const isAdminUser = u === 'aish';
            const active = u === currentUser ? 'active' : '';
            return `<button class="user-btn ${isAdminUser ? 'admin-user' : ''} ${active}" data-user="${u}" onclick="setUser('${u}')">${isAdminUser ? '👑 ' : ''}@${u}</button>`;
        }).join('');
    }

    // ========== 💾 SAVE ==========
    async function saveUsers() {
        try {
            const updated = messages.filter(m => !m.isSystem);
            const newSystem = {
                id: 'system_users_' + Date.now(),
                user: 'system',
                text: JSON.stringify({ users: users, chatEnabled: chatEnabled }),
                timestamp: new Date().toISOString(),
                isSystem: true
            };
            updated.push(newSystem);
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: updated })
            });
            if (!res.ok) throw new Error('Failed to save');
            messages = updated;
        } catch (error) { console.error('Save error:', error); }
    }

    async function saveRequests() {
        try {
            const updated = messages.filter(m => !m.isRequest && !m.isSystem);
            const newReq = {
                id: 'requests_' + Date.now(),
                user: 'system',
                text: JSON.stringify({ requests: pendingRequests }),
                timestamp: new Date().toISOString(),
                isRequest: true
            };
            updated.push(newReq);
            const sysMsg = messages.find(m => m.isSystem);
            if (sysMsg) updated.push(sysMsg);
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: updated })
            });
            if (!res.ok) throw new Error('Failed to save requests');
            messages = updated;
        } catch (error) { console.error('Save requests error:', error); }
    }

    // ========== 📥 FETCH ==========
    async function fetchMessages() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
            if (!res.ok) throw new Error('Failed to fetch');
            const data = await res.json();
            messages = data.record.messages || [];
            
            const sysMsg = messages.find(m => m.isSystem);
            if (sysMsg) {
                try {
                    const saved = JSON.parse(sysMsg.text);
                    if (saved.users) users = saved.users;
                    if (saved.chatEnabled !== undefined) chatEnabled = saved.chatEnabled;
                } catch (e) {}
            }
            
            const reqMsg = messages.find(m => m.isRequest);
            if (reqMsg) {
                try {
                    const saved = JSON.parse(reqMsg.text);
                    if (saved.requests) pendingRequests = saved.requests;
                } catch (e) {}
            }
            
            document.getElementById('requestBadge').style.display = pendingRequests.length > 0 ? 'inline-block' : 'none';
            
            // Check if current user is approved
            if (currentUser !== 'aish' && users.includes(currentUser)) {
                chatEnabled = true;
                document.getElementById('chatInput').disabled = false;
            } else if (currentUser !== 'aish' && !users.includes(currentUser)) {
                chatEnabled = false;
                document.getElementById('chatInput').disabled = true;
                document.getElementById('chatInput').placeholder = '⏳ Wait for admin approval...';
            }
            
            displayMessages();
            renderUsers();
            if (isAdmin) renderRequests();
            updateStatus(true);
            document.getElementById('msgCount').textContent = `${messages.filter(m => !m.isSystem && !m.isRequest).length} messages`;
        } catch (error) {
            updateStatus(false);
            console.error('Fetch error:', error);
        }
    }

    // ========== 📤 SEND ==========
    async function sendMessage() {
        if (currentUser !== 'aish' && !chatEnabled) {
            return showStatus('⏳ Wait for admin approval to chat!', 'error');
        }
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return showStatus('Please type something!', 'error');
        if (isSaving) return;

        const newMsg = {
            id: Date.now().toString(),
            user: currentUser,
            text: text,
            timestamp: new Date().toISOString()
        };

        isSaving = true;
        showStatus('⏳ Sending...', 'loading');

        try {
            const updated = messages.filter(m => !m.isSystem && !m.isRequest);
            const sysMsg = messages.find(m => m.isSystem);
            if (sysMsg) updated.push(sysMsg);
            const reqMsg = messages.find(m => m.isRequest);
            if (reqMsg) updated.push(reqMsg);
            updated.push(newMsg);
            
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: updated })
            });
            if (!res.ok) throw new Error('Failed to send');
            messages = updated;
            input.value = '';
            displayMessages();
            showStatus('✅ Message sent!', 'success');
            document.getElementById('msgCount').textContent = `${messages.filter(m => !m.isSystem && !m.isRequest).length} messages`;
        } catch (error) {
            showStatus('❌ Error: ' + error.message, 'error');
        } finally { isSaving = false; }
    }

    // ========== 🗑️ DELETE ==========
    async function deleteMessage(id) {
        if (!isAdmin) return showStatus('❌ Admin login required!', 'error');
        if (!confirm('Delete this message?')) return;
        if (isSaving) return;
        isSaving = true;
        showStatus('⏳ Deleting...', 'loading');
        try {
            const updated = messages.filter(m => m.id !== id);
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: updated })
            });
            if (!res.ok) throw new Error('Failed to delete');
            messages = updated;
            displayMessages();
            showStatus('🗑️ Message deleted!', 'success');
            document.getElementById('msgCount').textContent = `${messages.filter(m => !m.isSystem && !m.isRequest).length} messages`;
        } catch (error) {
            showStatus('❌ Delete failed: ' + error.message, 'error');
        } finally { isSaving = false; }
    }

    // ========== 🖥️ DISPLAY ==========
    function displayMessages() {
        const box = document.getElementById('chatBox');
        const displayMsgs = messages.filter(m => !m.isSystem && !m.isRequest);
        if (displayMsgs.length === 0) {
            box.innerHTML = '<p class="empty-msg">💬 No messages yet. Start chatting!</p>';
            return;
        }
        box.innerHTML = displayMsgs.map(msg => {
            const isAish = msg.user === 'aish';
            const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isLink = msg.text.startsWith('http://') || msg.text.startsWith('https://');
            const displayText = isLink ? `<a href="${msg.text}" target="_blank" style="color:inherit;text-decoration:underline;">${msg.text}</a>` : msg.text;
            const userClass = isAish ? 'aish' : 'user1';
            return `
                <div class="msg ${userClass}">
                    <div class="sender">${isAish ? '👑 @aish' : `@${msg.user}`}</div>
                    <div>${displayText}</div>
                    <div class="time">${time} ${isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}')">🗑️</button>` : ''}</div>
                </div>
            `;
        }).join('');
        box.scrollTop = box.scrollHeight;
    }

    // ========== 💬 STATUS ==========
    function showStatus(text, type) {
        const el = document.getElementById('statusText');
        el.textContent = text;
        el.style.color = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : type === 'loading' ? '#ffc107' : '#888';
        if (type !== 'loading') setTimeout(() => { el.textContent = 'Connected'; el.style.color = '#888'; }, 4000);
    }

    function updateStatus(online) {
        document.getElementById('statusDot').className = 'status-dot ' + (online ? 'online' : 'offline');
        document.getElementById('statusText').textContent = online ? 'Connected' : 'Disconnected';
    }

    // ========== 🚀 INIT ==========
    async function init() {
        myUniqueId = await getUniqueId();
        console.log('🆔 Your Unique ID:', myUniqueId);
        // Check if this user is already in users list
        // We'll check during fetch
        fetchMessages();
        setInterval(fetchMessages, 5000);
        // Disable input initially for non-admin
        if (currentUser !== 'aish') {
            document.getElementById('chatInput').disabled = true;
            document.getElementById('chatInput').placeholder = '⏳ Wait for admin approval...';
        }
    }

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    init();
</script>

</body>
</html>
