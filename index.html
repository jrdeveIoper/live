<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Link</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 25px;
    }

    .url-box {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      word-break: break-all;
      margin-bottom: 15px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Your Link</h1>

    <div id="url" class="url-box">
      Loading...
    </div>

    <button onclick="copyLink()">
      Copy Link
    </button>

    <div id="message"></div>

  </div>

  <script>

    let outputURL = "";

    async function loadURL() {

      try {

        const response = await fetch(
          "url.txt?t=" + Date.now()
        );

        if (!response.ok) {
          throw new Error("URL not found");
        }

        const url = (await response.text()).trim();

        if (!url) {

          document.getElementById("url").innerText =
            "No URL available";

          return;
        }

        outputURL = url;

        document.getElementById("url").innerText =
          url;

      } catch (error) {

        document.getElementById("url").innerText =
          "Unable to load URL";

      }

    }


    async function copyLink() {

      if (!outputURL) {
        return;
      }

      try {

        await navigator.clipboard.writeText(outputURL);

        document.getElementById("message").innerText =
          "✓ Link copied";

      } catch (error) {

        const textarea =
          document.createElement("textarea");

        textarea.value = outputURL;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        document.getElementById("message").innerText =
          "✓ Link copied";

      }

    }

    loadURL();

  </script>

</body>
</html>
